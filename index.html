<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="บันทึกบิล">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>บันทึกบิล</title>
<style>
:root{--bg:#f2f2f7;--hdr:rgba(242,242,247,.88);--card:#fff;--field:#f6f6f9;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#0a7cff;--accent-soft:#e7f1ff;--ok:#15803d;--ok-soft:#e8f6ec;--warn:#b45309;--warn-soft:#fff4e0;--err:#dc2626;--err-soft:#fdecec;--r:14px}
@media (prefers-color-scheme:dark){:root{--bg:#000;--hdr:rgba(0,0,0,.85);--card:#1c1c1e;--field:#2c2c2e;--text:#f5f5f7;--muted:#9ca3af;--line:#38383a;--accent:#3b95ff;--accent-soft:#0d2a4d;--ok:#4ade80;--ok-soft:#0f2a19;--warn:#fbbf24;--warn-soft:#33260a;--err:#f87171;--err-soft:#3a1414}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Sukhumvit Set","Thonburi","Noto Sans Thai","Segoe UI",sans-serif;font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:var(--hdr);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
header h1{font-size:20px;margin:0;font-weight:700}
.badge{border:0;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.pend{background:var(--warn-soft);color:var(--warn)}.badge.err{background:var(--err-soft);color:var(--err)}.badge.off{background:var(--field);color:var(--muted)}
main{max-width:640px;margin:0 auto;padding:4px 16px calc(96px + env(safe-area-inset-bottom))}
h2{font-size:26px;margin:6px 2px 12px}
h3{font-size:17px;margin:0 0 10px}
.view[hidden]{display:none}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px}
.muted{color:var(--muted)}.small{font-size:13px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:12px}
label>input,label>select,label>textarea,.field{display:block;width:100%;margin-top:5px}
input,select,textarea{-webkit-appearance:none;appearance:none;background:var(--field);border:1px solid transparent;border-radius:10px;padding:11px 12px;font-size:16px;min-height:46px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input[type=date],input[type=time]{text-align:left}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
textarea{resize:vertical;min-height:64px}
#f-amount{font-size:30px;font-weight:700;padding:8px 12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inline{display:flex;gap:8px;align-items:stretch}.inline>select{flex:1;margin-top:0}
.btn,button{border:0;border-radius:11px;padding:11px 14px;background:var(--field);color:var(--text);font-weight:600;cursor:pointer;text-align:center;font-size:15px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
label.btn{color:var(--text);margin:0}
.primary{background:var(--accent);color:#fff}
.danger{background:var(--err-soft);color:var(--err)}
.big{width:100%;font-size:17px;min-height:52px;margin-bottom:10px}
.icon-btn{min-width:46px;padding:0 12px;font-size:20px}
.photo-box{border-radius:12px;background:var(--field);min-height:120px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:10px;cursor:pointer}
.photo-box img{display:block;width:100%;max-height:340px;object-fit:contain;background:#000}
#photo-empty{color:var(--muted);font-size:14px;padding:20px;text-align:center}
.notice{border-radius:10px;padding:10px 12px;font-size:14px;margin-top:10px}
.notice.info{background:var(--accent-soft);color:var(--accent)}.notice.ok{background:var(--ok-soft);color:var(--ok)}.notice.warn{background:var(--warn-soft);color:var(--warn)}
.notice details{margin-top:6px;color:var(--muted)}.notice pre{white-space:pre-wrap;font-size:12px;max-height:180px;overflow:auto;margin:6px 0 0}
.hint{color:var(--ok);font-weight:600}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:5px}
.seg button{padding:8px 4px;font-size:13px;flex-direction:column;gap:2px;min-height:54px;border:1.5px solid transparent}
.seg button.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.tagbox{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--field);border-radius:10px;padding:6px 8px;margin-top:5px;min-height:46px}
.tagbox input{flex:1;min-width:110px;border:0;background:transparent;padding:6px 4px;min-height:32px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 10px;font-size:14px;font-weight:600;cursor:pointer;border:0;min-height:0}
.chip.sm{font-size:12px;padding:2px 8px}
.chip.ghost{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters select{flex:0 0 auto;width:auto;min-height:40px;padding:8px 30px 8px 12px;font-size:14px;background-color:var(--card)}
.filters select.on{background-color:var(--accent-soft);color:var(--accent)}
#list-q{width:100%;background:var(--card);margin-bottom:12px}
.list-total{display:flex;justify-content:space-between;align-items:baseline;background:var(--card);border-radius:var(--r);padding:12px 14px;margin-bottom:14px}
.list-total b{font-size:20px}
.day-h{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:600;margin:0 4px 6px}
.card.list{padding:0 14px}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 38px}
.mid{flex:1;min-width:0}.mid .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mid .s{font-size:13px;color:var(--muted)}.mid .note{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.amt{font-weight:700;white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.seg2{display:grid;grid-template-columns:1fr 1fr;background:var(--field);border-radius:10px;padding:3px;margin-bottom:12px}
.seg2 button{background:transparent;min-height:36px;padding:6px}.seg2 button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.period{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.period b{font-size:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border-radius:var(--r);padding:12px 13px;min-width:0}
.stat.wide{grid-column:1/-1}
.stat .k{font-size:12px;color:var(--muted);font-weight:600}
.stat .v{font-size:19px;font-weight:700;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat.wide .v{font-size:32px}
.stat .d{font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.up{color:var(--err)}.down{color:var(--ok)}
.chart-info{font-size:13px;color:var(--muted);min-height:20px;margin-bottom:6px}
.bars{display:flex;align-items:flex-end;gap:2px;height:150px;border-bottom:1px solid var(--line)}
.bar-col{flex:1;height:100%;display:flex;align-items:flex-end;cursor:pointer;min-width:0}
.bar{width:100%;background:var(--accent);border-radius:3px 3px 0 0;opacity:.85}
.bar-col.sel .bar{opacity:1;background:#f59e0b}
.bar-labels{display:flex;gap:2px;margin-top:4px}
.bar-labels span{flex:1;font-size:10px;color:var(--muted);text-align:center;min-width:0;overflow:visible;white-space:nowrap}
.hrow{margin-bottom:11px}
.hrow .top{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:4px}
.hrow .top span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:8px;background:var(--field);border-radius:99px;overflow:hidden}
.fill{height:100%;border-radius:99px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mcard{background:var(--field);border-radius:12px;padding:10px 11px;cursor:pointer;min-width:0}
.mcard .k{font-size:13px;font-weight:700}.mcard .v{font-size:16px;font-weight:700}.mcard .d{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mcard.zero{opacity:.5}
.setrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.setrow button{min-height:34px;padding:6px 10px;font-size:13px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.btns>*{flex:1 1 140px}
details.howto summary{cursor:pointer;font-weight:600;color:var(--accent);margin-top:12px}
details.howto ol{padding-left:20px;font-size:14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);background:var(--hdr);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav.tabs button{background:transparent;flex-direction:column;gap:1px;font-size:11px;font-weight:600;color:var(--muted);min-height:50px;padding:4px}
nav.tabs button span{font-size:22px;line-height:1.1}
nav.tabs button.on{color:var(--accent)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;padding:16px 12px calc(16px + env(safe-area-inset-bottom))}
.modal[hidden]{display:none}
.modal-card{background:var(--card);border-radius:18px;padding:18px;width:100%;max-width:440px;max-height:85vh;overflow:auto}
.modal-card h3{font-size:18px}
.modal-body{font-size:15px;margin-bottom:14px}
.modal-btns{display:flex;gap:8px}.modal-btns button{flex:1}
.viewer{position:fixed;inset:0;z-index:60;background:#000;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.viewer[hidden]{display:none}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}
.viewer button{position:absolute;top:calc(env(safe-area-inset-top) + 10px);right:12px;background:rgba(255,255,255,.2);color:#fff}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:70;background:rgba(17,24,39,.94);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;max-width:88vw;text-align:center;pointer-events:none;transition:opacity .2s;opacity:0}
.toast.show{opacity:1}
.fatal{background:var(--err-soft);color:var(--err);border-radius:12px;padding:14px;margin:12px 0}
</style>
</head>
<body>
<header>
  <h1 id="hdr-title">บันทึกบิล</h1>
  <button id="sync-badge" class="badge off" data-act="sync-badge" hidden></button>
</header>

<main>
  <div id="fatal"></div>

  <!-- ===== บันทึก ===== -->
  <section id="v-add" class="view">
    <h2 id="form-title">บันทึกรายจ่าย</h2>
    <div class="card">
      <div class="photo-box" id="photo-box" data-act="view-photo">
        <img id="photo-preview" alt="รูปสลิป" hidden>
        <div id="photo-empty">📷 ถ่ายรูปสลิป/บิล แอปจะอ่านร้าน วันเวลา และยอดเงินให้</div>
      </div>
      <div class="row2">
        <label class="btn primary">📷 ถ่ายรูป<input type="file" accept="image/*" capture="environment" id="in-camera" hidden></label>
        <label class="btn">🖼️ เลือกจากคลัง<input type="file" accept="image/*" id="in-gallery" hidden></label>
      </div>
      <div class="row2" id="photo-actions" style="margin-top:10px" hidden>
        <button type="button" data-act="reread">🔍 อ่านอีกครั้ง</button>
        <button type="button" data-act="rm-photo">ลบรูป</button>
      </div>
      <div id="ocr-status" class="notice" hidden></div>
    </div>

    <div class="card">
      <label>จำนวนเงิน (บาท)<input id="f-amount" inputmode="decimal" placeholder="0.00" autocomplete="off"></label>
      <label>ชื่อร้าน<input id="f-shop" list="dl-shops" placeholder="เช่น 7-Eleven, ร้านป้าแดง" autocomplete="off"></label>
      <datalist id="dl-shops"></datalist>
      <div class="row2">
        <label>วันที่<input type="date" id="f-date"></label>
        <label>เวลา<input type="time" id="f-time"></label>
      </div>
      <label for="f-cat">หมวดหมู่ <span id="cat-hint" class="hint"></span></label>
      <div class="inline" style="margin:-7px 0 12px">
        <select id="f-cat" class="field"></select>
        <button type="button" class="icon-btn" data-act="add-cat" aria-label="เพิ่มหมวดหมู่">＋</button>
      </div>
      <label>ช่องทางจ่ายเงิน</label>
      <div class="seg" id="f-pay" style="margin:-7px 0 12px"></div>
      <label for="f-tag">แท็ก (พิมพ์แล้วเว้นวรรค)</label>
      <div class="tagbox" id="tagbox" style="margin-top:-7px"><input id="f-tag" placeholder="#งาน #ทริปเชียงใหม่" autocomplete="off" enterkeyhint="done"></div>
      <div class="sugg" id="tag-sugg"></div>
      <label style="margin-top:12px">รายละเอียด<textarea id="f-note" rows="2" placeholder="รายการที่ซื้อ หมายเหตุ"></textarea></label>
    </div>

    <button type="button" class="primary big" data-act="save">บันทึก</button>
    <div class="row2" id="edit-actions" hidden>
      <button type="button" data-act="cancel-edit">ยกเลิก</button>
      <button type="button" class="danger" data-act="delete">🗑 ลบรายการ</button>
    </div>
  </section>

  <section id="v-list" class="view" hidden></section>
  <section id="v-summary" class="view" hidden></section>
  <section id="v-settings" class="view" hidden></section>
</main>

<nav class="tabs">
  <button data-act="tab" data-v="add" class="on"><span>＋</span>บันทึก</button>
  <button data-act="tab" data-v="list"><span>☰</span>รายการ</button>
  <button data-act="tab" data-v="summary"><span>📊</span>สรุป</button>
  <button data-act="tab" data-v="settings"><span>⚙︎</span>ตั้งค่า</button>
</nav>

<div id="modal" class="modal" hidden><div class="modal-card"><h3 id="modal-title"></h3><div class="modal-body" id="modal-body"></div><div class="modal-btns" id="modal-btns"></div></div></div>
<div id="viewer" class="viewer" hidden data-act="close-viewer"><img id="viewer-img" alt=""><button type="button" data-act="close-viewer">ปิด ✕</button></div>
<div id="toast" class="toast"></div>
<input type="file" id="imp-file" accept="application/json,.json" hidden>

<script type="text/plain" id="gs-code">/**
 * บันทึกบิล — ตัวรับข้อมูลซิงก์ (Google Apps Script)
 *
 * วิธีติดตั้ง
 * 1) สร้าง Google Sheet ใหม่ > เมนู ส่วนขยาย (Extensions) > Apps Script
 * 2) ลบโค้ดเดิมทั้งหมด แล้ววางโค้ดนี้แทน
 * 3) เปลี่ยนค่า SECRET ด้านล่างเป็นรหัสลับของคุณเอง (ยาว เดายาก) แล้วกดบันทึก
 * 4) Deploy > New deployment > เลือกประเภท Web app
 *      Execute as: Me   |   Who has access: Anyone
 *    กด Deploy แล้วอนุญาตสิทธิ์ (Authorize access)
 * 5) คัดลอก Web app URL (ลงท้ายด้วย /exec) ไปวางในแอป พร้อมรหัสลับเดียวกัน
 *
 * หมายเหตุ: ถ้าแก้โค้ดนี้ภายหลัง ต้อง Deploy > Manage deployments > Edit > Version: New version
 */

const SECRET = 'CHANGE-ME';
const SHEET_NAME = 'รายจ่าย';
const HEADERS = ['ID', 'วันที่', 'เวลา', 'ร้าน', 'จำนวนเงิน', 'หมวดหมู่', 'ช่องทางจ่าย', 'แท็ก', 'รายละเอียด', 'รูปบิล', 'สร้างเมื่อ', 'แก้ไขล่าสุด'];

function doGet() {
  return out_({ ok: true, app: 'billbook', message: 'พร้อมรับข้อมูล' });
}

function doPost(e) {
  let body;
  try {
    body = JSON.parse(e.postData.contents);
  } catch (err) {
    return out_({ ok: false, error: 'bad_json' });
  }
  if (!SECRET || SECRET === 'CHANGE-ME') {
    return out_({ ok: false, error: 'ยังไม่ได้ตั้งค่า SECRET ใน Apps Script' });
  }
  if (body.secret !== SECRET) return out_({ ok: false, error: 'unauthorized' });

  const lock = LockService.getScriptLock();
  if (!lock.tryLock(30000)) return out_({ ok: false, error: 'busy' });
  try {
    const sh = sheet_();
    if (body.action === 'ping') {
      return out_({ ok: true, rows: Math.max(sh.getLastRow() - 1, 0) });
    }
    if (body.action === 'sync') {
      const res = applyOps_(sh, body.ops || []);
      res.ok = true;
      return out_(res);
    }
    return out_({ ok: false, error: 'unknown_action' });
  } catch (err) {
    return out_({ ok: false, error: String((err && err.message) || err) });
  } finally {
    lock.releaseLock();
  }
}

function sheet_() {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  let sh = ss.getSheetByName(SHEET_NAME);
  if (!sh) sh = ss.insertSheet(SHEET_NAME);
  if (sh.getLastRow() === 0) {
    sh.getRange('A:A').setNumberFormat('@');
    sh.getRange(1, 1, 1, HEADERS.length).setValues([HEADERS]).setFontWeight('bold');
    sh.setFrozenRows(1);
    sh.getRange('E:E').setNumberFormat('#,##0.00');
  }
  return sh;
}

function applyOps_(sh, ops) {
  const last = sh.getLastRow();
  const index = {};
  if (last > 1) {
    sh.getRange(2, 1, last - 1, 1).getValues().forEach(function (r, i) {
      const id = String(r[0]);
      if (id) index[id] = i + 2;
    });
  }
  const updates = [];
  const delRows = [];
  const appendMap = {};
  const appends = [];

  ops.forEach(function (op) {
    if (!op) return;
    if (op.op === 'delete') {
      const id = String(op.id);
      if (index[id]) { delRows.push(index[id]); delete index[id]; }
      if (appendMap[id] !== undefined) { appends[appendMap[id]] = null; delete appendMap[id]; }
    } else if (op.op === 'upsert' && op.item && op.item.id) {
      const id = String(op.item.id);
      const row = row_(op.item);
      if (index[id]) updates.push([index[id], row]);
      else if (appendMap[id] !== undefined) appends[appendMap[id]] = row;
      else { appendMap[id] = appends.length; appends.push(row); }
    }
  });

  updates.forEach(function (u) {
    sh.getRange(u[0], 1, 1, u[1].length).setValues([u[1]]);
  });

  delRows.sort(function (a, b) { return b - a; }).forEach(function (r) {
    // ชีตห้ามลบแถวที่ไม่ได้ freeze จนหมด — กรณีเหลือแถวเดียวให้ล้างค่าแทน
    if (sh.getMaxRows() <= sh.getFrozenRows() + 1) {
      sh.getRange(r, 1, 1, HEADERS.length).clearContent();
    } else {

}

// <parse>
const TH_MONTH_PATTERNS = [
  ['มกราคม',1],['กุมภาพันธ์',2],['มีนาคม',3],['เมษายน',4],['พฤษภาคม',5],['มิถุนายน',6],['กรกฎาคม',7],['สิงหาคม',8],['กันยายน',9],['ตุลาคม',10],['พฤศจิกายน',11],['ธันวาคม',12],

const EN_MONTHS = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };
function normYear(y) {
  y = +y;
  if (y < 100) y = y >= 50 ? 2500 + y : 2000 + y;
  if (y > 2400) y -= 543;
  return y;
}
function mkDate(y, m, d) {
  y = normYear(y); m = +m; d = +d;
  if (!(y >= 2000 && y <= 2100 && m >= 1 && m <= 12 && d >= 1 && d <= new Date(y, m, 0).getDate())) return null;
  return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;

function cleanLine(l) {

function parseDate(text) {
  let m = text.match(/(20\d{2}|25\d{2})-(\d{1,2})-(\d{1,2})/);
  if (m) { const r = mkDate(m[1], m[2], m[3]); if (r) return r; }
  const numRe = /(?:^|\D)(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4}|\d{2})(?!\d)/g;
  while ((m = numRe.exec(text))) { const r = mkDate(m[3], m[2], m[1]); if (r) return r; }
  const compact = text.replace(/\s+/g, '');
  for (const [p, mon] of TH_MONTH_PATTERNS) {
    const re = new RegExp('(?:^|\\D)(\\d{1,2})' + p + '(25\\d{2}|20\\d{2}|\\d{2})', 'g');
    while ((m = re.exec(compact))) { const r = mkDate(m[2], mon, m[1]); if (r) return r; }
  }
  const enRe = /(?:^|\D)(\d{1,2})\s*[-\s]?(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?[-\s,]*(\d{4}|\d{2})(?!\d)/gi;
  while ((m = enRe.exec(text))) { const r = mkDate(m[3], EN_MONTHS[m[2].toLowerCase()], m[1]); if (r) return r; }

}

  if (m) return `${m[1].padStart(2, '0')}:${m[2]}`;
  m = text.match(/(?:^|\D)([01]?\d|2[0-3])\.([0-5]\d)\s*น/);

const AMT_KEYS = [
  [/ยอดสุทธิ|สุทธิ|nettotal|grandtotal|รวมทั้งสิ้น|ยอดชำระ|totaldue|amountdue|totalamount/, 5],
  [/จำนวนเงิน|จํานวนเงิน|amount/, 4],
  [/ยอดรวม|รวมเงิน|total/, 3],
  [/รวม/, 2],
];
const AMT_EXCL = /ส่วนลด|discount|vat|ภาษี|เงินทอน|ทอน|change|รับเงิน|เงินสด|cash|tender|ค่าธรรมเนียม|fee|subtotal|ก่อนภาษี|point|แต้ม|คะแนน|คงเหลือ|balance|จำนวนชิ้น|จำนวนรายการ|items|qty/;
const SHOP_SKIP = /ใบเสร็จ|ใบกำกับ|receipt|invoice|tax|โทร|tel|เลขที่|pos|vat|สาขา|branch|วันที่|date|เวลา|time|cashier|พนักงาน|สำเร็จ|รายการ|ref|เลขประจำตัว|www|http|ยินดี|welcome|thank|ขอบคุณ|สำเนา|copy|order|โต๊ะ|table/i;
function parseReceipt(text) {
  const lines = String(text || '').split(/\r?\n/).map(cleanLine).filter(Boolean);
  const r = { shop: '', date: null, time: null, amount: 0, payment: '' };
  // ยอดเงิน
  let best = null;
  lines.forEach((line, i) => {
    const key = line.toLowerCase().replace(/\s+/g, '');
    if (AMT_EXCL.test(key)) return;
    let score = 0;
    for (const [re, s] of AMT_KEYS) if (re.test(key)) { score = s; break; }
    if (!score) return;
    let nums = numsIn(line);
    if (!nums.length && lines[i + 1] && !AMT_EXCL.test(lines[i + 1].toLowerCase())) nums = numsIn(lines[i + 1]);
    if (!nums.length) return;
    const val = nums[nums.length - 1];
    if (!best || score > best.score || (score === best.score && i > best.i)) best = { score, val, i };

  r.time = parseTime(lines.join('\n'));

  if (/โอนเงิน|transfer|promptpay|พร้อมเพย์|เลขที่รายการ/.test(low)) r.payment = 'โอน';
  else if (/visa|mastercard|master card|jcb|amex|credit|เครดิต/.test(low)) r.payment = 'บัตรเครดิต';
  else if (/qr|debit|เดบิต|truemoney|ทรูมันนี่|wallet/.test(low)) r.payment = 'บัตรเดบิต/QR';
  else if (/เงินสด|cash/.test(low)) r.payment = 'เงินสด';

  const letters = l => (l.match(/[A-Za-z฀-๿]/g) || []).length;
  const tidy = l => l.replace(/^[^A-Za-z฀-๿0-9]+|[^A-Za-z฀-๿0-9)]+$/g, '').slice(0, 60);
  for (let i = 0; i < lines.length; i++) {
    const m = lines[i].match(/^(?:(?:ไปยัง|ผู้รับ(?:เงิน)?)\s*:?\s*|to(?:\s*:\s*|\s+|$))(.*)$/i);
    if (m) {
      const cand = letters(m[1]) >= 3 ? m[1] : (lines[i + 1] || '');
      if (letters(cand) >= 3) { r.shop = tidy(cand); break; }
    }

  if (!r.shop && r.payment === 'โอน') {
    // สลิปโอนเงิน: บรรทัดชื่อแรกคือผู้โอน บรรทัดชื่อที่สองคือผู้รับ
    const BANK = /ธ\.|ธนาคาร|bank|พร้อมเพย์|promptpay|กสิกร|ไทยพาณิชย์|กรุงเทพ|กรุงไทย|กรุงศรี|ออมสิน|ทหารไทย|ttb|scb|kbank|ktb|bbl|เลขที่|จำนวน|ค่าธรรมเนียม|สำเร็จ|จาก/i;
    const names = lines.filter(l => !/\d/.test(l) && letters(l) >= 3 && !BANK.test(l) && !SHOP_SKIP.test(l));
    if (names.length) r.shop = tidy(names[names.length >= 2 ? 1 : 0]);
  }
  if (!r.shop) {
    for (const l of lines.slice(0, 8)) {
      const n = letters(l);
      if (n >= 3 && n / l.replace(/\s/g, '').length > 0.5 && !SHOP_SKIP.test(l)) { r.shop = tidy(l); break; }
    }
  }

}

async function ocrGemini(canvas) {
  const key = S.settings.geminiKey.trim();
  if (!key) throw new Error('ยังไม่ได้ใส่ Gemini API key ในหน้าตั้งค่า');
  const blob = await canvasToBlob(canvas, 'image/jpeg', 0.85);
  const b64 = (await blobToDataURL(blob)).split(',')[1];
  const cats = S.categories.map(c => c.name).join(', ');
  const prompt = `อ่านสลิป/ใบเสร็จในภาพ แล้วตอบเป็น JSON อย่างเดียว รูปแบบ:
{"shop":"ชื่อร้านหรือผู้รับเงิน","date":"YYYY-MM-DD เป็นปี ค.ศ.","time":"HH:MM","amount":ยอดที่จ่ายจริงสุทธิเป็นตัวเลข,"payment":"เงินสด|โอน|บัตรเครดิต|บัตรเดบิต/QR หรือ \\"\\"","category":"เลือกหนึ่งจาก: ${cats}","note":"สรุปรายการสินค้าสั้นๆ"}
ถ้าอ่านค่าใดไม่ได้ให้ใส่ null ห้ามเดา`;
  const model = encodeURIComponent(S.settings.geminiModel.trim() || 'gemini-2.5-flash');
  const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 40000);
  try {
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(key)}`, {
      method: 'POST', signal: ctrl.signal, headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: 'image/jpeg', data: b64 } }] }], generationConfig: { temperature: 0, responseMimeType: 'application/json' } }),
    });
    const j = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error((j.error && j.error.message) || 'HTTP ' + res.status);
    const txt = ((j.candidates || [])[0]?.content?.parts || []).map(p => p.text || '').join('').replace(/```json|```/g, '').trim();
    const o = JSON.parse(txt);
    let date = null;
    if (o.date) { const m = String(o.date).match(/(\d{4})-(\d{1,2})-(\d{1,2})/); if (m) date = mkDate(m[1], m[2], m[3]); }
    let time = null;
    if (o.time) { const m = String(o.time).match(/(\d{1,2}):(\d{2})/); if (m && +m[1] < 24 && +m[2] < 60) time = `${m[1].padStart(2, '0')}:${m[2]}`; }
    return { shop: o.shop ? String(o.shop).slice(0, 60) : '', date, time, amount: parseAmount(o.amount), payment: PAYMENTS.includes(o.payment) ? o.payment : '', category: o.category || '', note: o.note ? String(o.note).slice(0, 300) : '' };
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('หมดเวลาเชื่อมต่อ');
    if (e instanceof TypeError) throw new Error('เชื่อมต่อเน็ตไม่ได้');
    if (e instanceof SyntaxError) throw new Error('อ่านคำตอบไม่ได้');
    throw e;
  } finally { clearTimeout(t); }
}

let ocrToken = 0;
async function runOcr() {
  const mode = S.settings.ocrMode;
  if (mode === 'off') { setOcr('info', `บีบอัดและแนบรูปแล้ว (${Math.round(S.form.image.size / 1024)} KB) — การอ่านอัตโนมัติปิดอยู่`); return; }

    try { const { img, url } = await fileToImage(S.form.image); S.form.ocrCanvas = drawScaled(img, 2000); URL.revokeObjectURL(url); } catch (_) {}
  }
  if (!S.form.ocrCanvas) return;
  if (!navigator.onLine && !(mode === 'local' && tessWorker)) {
    setOcr('warn', '⚠ ออฟไลน์อยู่ อ่านสลิปไม่ได้ — กรุณากรอกข้อมูลเอง (รูปบิลถูกแนบไว้แล้ว)');
    return;
  }
  const token = ++ocrToken;
  try {
    let r;
    if (mode === 'gemini') {
      setOcr('info', 'กำลังอ่านสลิปด้วย Gemini…');
      r = await ocrGemini(S.form.ocrCanvas);
    } else {
      setOcr('info', tessWorker ? 'กำลังอ่านสลิป…' : 'กำลังเตรียมตัวอ่านสลิป… (ครั้งแรกต้องดาวน์โหลดข้อมูลภาษาไทยสักครู่)');
      r = await ocrLocal(S.form.ocrCanvas, p => { if (token === ocrToken) setOcr('info', `กำลังอ่านสลิป… ${Math.round(p * 100)}%`); });
    }
    if (token !== ocrToken) return;
    applyOcr(r);
  } catch (e) {
    if (token !== ocrToken) return;
    setOcr('warn', `⚠ อ่านสลิปไม่สำเร็จ (${esc(e.message)}) — กรุณากรอกข้อมูลเอง`);
  }
}

function addTo(o, k, v, label) { const x = o[k] || (o[k] = { sum: 0, n: 0, label: label || k }); x.sum += v; x.n++; }

  const s = { total: 0, count: items.length, cat: {}, pay: {}, tag: {}, shop: {}, day: {} };
  items.forEach(e => {
    s.total += e.amount;
    addTo(s.cat, e.category, e.amount); addTo(s.pay, e.payment, e.amount); addTo(s.day, e.date, e.amount);
    if (e.shop !== 'ไม่ระบุร้าน') addTo(s.shop, normShop(e.shop), e.amount, e.shop);

const topBy = (o, f = 'sum') => Object.values(o).sort((a, b) => b[f] - a[f] || b.sum - a.sum)[0];

}

/* ================= ซิงก์ Google Sheets ================= */
const isConnected = () => !!(S.settings.syncUrl && S.settings.syncSecret);
async function enqueue(ids, op) {
  if (!isConnected() || !ids.length) return;
  const ts = Date.now();
  try { await idb.putMany('outbox', ids.map(id => ({ id, op, ts }))); } catch (_) { return; }
  S.sync.pending = await idb.count('outbox');
  updateBadge(); scheduleSync();
}
function scheduleSync(delay = 1200) { clearTimeout(S.sync.timer); S.sync.timer = setTimeout(flushSync, delay); }
function toSheetItem(e) {
  return { id: e.id, date: e.date, time: e.time, shop: e.shop, amount: e.amount, category: e.category, payment: e.payment, tags: (e.tags || []).map(t => '#' + t).join(' '), note: e.note || '', hasImage: !!e.hasImage, createdAt: stamp(e.createdAt), updatedAt: stamp(e.updatedAt) };
}
async function postSheet(payload) {
  const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 30000);
  try {
    const res = await fetch(S.settings.syncUrl, { method: 'POST', redirect: 'follow', signal: ctrl.signal, headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ ...payload, secret: S.settings.syncSecret }) });
    const text = await res.text();
    let j;
    try { j = JSON.parse(text); } catch (_) { throw new Error(res.ok ? 'ชีตตอบกลับผิดรูปแบบ — ตรวจว่า Deploy เป็น Web app และเลือก Who has access: Anyone' : 'HTTP ' + res.status); }
    if (!j.ok) throw new Error(j.error === 'unauthorized' ? 'รหัสลับไม่ตรงกับใน Apps Script' : (j.error || 'ผิดพลาด'));
    return j;
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('หมดเวลาเชื่อมต่อ');
    if (e instanceof TypeError) throw new Error(navigator.onLine ? 'เชื่อมต่อชีตไม่ได้ — ตรวจ URL และสิทธิ์ Anyone' : 'ออฟไลน์อยู่');
    throw e;
  } finally { clearTimeout(t); }
}
async function flushSync() {
  if (!isConnected()) { updateBadge(); return; }
  if (S.sync.busy) { S.sync.again = true; return; }
  clearTimeout(S.sync.retryTimer);
  const box = await idb.getAll('outbox').catch(() => []);
  S.sync.pending = box.length;
  if (!box.length) { S.sync.error = ''; updateBadge(); return; }
  if (!navigator.onLine) { updateBadge(); return; }
  S.sync.busy = true; updateBadge();
  try {
    for (let i = 0; i < box.length; i += 200) {
      const chunk = box.slice(i, i + 200);
      const ops = chunk.map(b => { const it = b.op === 'upsert' ? expById(b.id) : null; return it ? { op: 'upsert', item: toSheetItem(it) } : { op: 'delete', id: b.id }; });
      await postSheet({ action: 'sync', ops });
      for (const b of chunk) { const cur = await idb.get('outbox', b.id); if (cur && cur.ts === b.ts) await idb.del('outbox', b.id); }
    }
    S.sync.error = ''; S.settings.lastSync = Date.now(); saveSettings();
  } catch (e) {
    S.sync.error = e.message;
    S.sync.retryTimer = setTimeout(flushSync, 30000);
  } finally {
    S.sync.busy = false;
    S.sync.pending = await idb.count('outbox').catch(() => 0);
    updateBadge();
    if (S.view === 'settings') renderSyncStatus();
    if (S.sync.again || (S.sync.pending && !S.sync.error)) { S.sync.again = false; scheduleSync(300); }
  }
}
function updateBadge() {
  const b = $('#sync-badge');
  if (!isConnected()) { b.hidden = true; return; }
  b.hidden = false;
  let cls, txt;
  if (S.sync.error && S.sync.pending) { cls = 'err'; txt = '⚠ ซิงก์ไม่สำเร็จ'; }
  else if (S.sync.busy || S.sync.pending) { cls = 'pend'; txt = `● รอซิงก์${S.sync.pending ? ` (${S.sync.pending})` : ''}`; }
  else { cls = 'ok'; txt = '✓ ซิงก์แล้ว'; }
  b.className = 'badge ' + cls; b.textContent = txt;
}
async function connectSheet() {
  const url = $('#s-url').value.trim(), secret = $('#s-secret').value.trim();
  const msg = $('#sync-msg');
  if (!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec/.test(url)) { msg.innerHTML = '<span class="up">URL ต้องเป็นลิงก์ Web app ของ script.google.com ที่ลงท้ายด้วย /exec</span>'; return; }
  if (!secret) { msg.innerHTML = '<span class="up">กรุณาใส่รหัสลับ</span>'; return; }
  const old = { syncUrl: S.settings.syncUrl, syncSecret: S.settings.syncSecret };
  S.settings.syncUrl = url; S.settings.syncSecret = secret;
  msg.textContent = 'กำลังทดสอบการเชื่อมต่อ…';
  try {
    await postSheet({ action: 'ping' });
  } catch (e) {
    Object.assign(S.settings, old);
    msg.innerHTML = `<span class="up">⚠ ${esc(e.message)}</span>`;
    return;
  }
  await saveSettings();
  S.sync.error = '';
  await enqueue(S.expenses.map(e => e.id), 'upsert');
  msg.innerHTML = `<span class="down">✓ เชื่อมต่อสำเร็จ กำลังส่ง ${S.expenses.length} รายการขึ้นชีต…</span>`;
  updateBadge();
  await flushSync();
  renderSettings();
  toast(S.sync.error ? '⚠ ส่งข้อมูลไม่สำเร็จ จะลองใหม่อัตโนมัติ' : '✓ เชื่อมต่อและส่งข้อมูลแล้ว');
}
async function disconnectSheet() {
  const ok = await confirmBox('ยกเลิกการเชื่อมต่อ?', 'แอปจะหยุดส่งข้อมูลไปชีต<br>ข้อมูลที่อยู่ในชีตแล้ว <b>จะไม่ถูกลบ</b>', 'ยกเลิกการเชื่อมต่อ', true);

/* ================= สำรอง / ส่งออก ================= */
async function shareOrDownload(blob, filename) {
  const file = new File([blob], filename, { type: blob.type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: filename }); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}

async function importJSON(file) {

  if (!ok) return;
  const changed = [];
  for (const e of valid) {
    const cur = expById(e.id);
    const item = { time: '00:00', shop: 'ไม่ระบุร้าน', category: 'อื่นๆ', payment: 'เงินสด', tags: [], note: '', hasImage: false, createdAt: Date.now(), updatedAt: Date.now(), ...e };
    if (cur && (cur.updatedAt || 0) >= (item.updatedAt || 0)) continue;
    if (data.images && data.images[e.id]) { try { await idb.put('images', await dataURLToBlob(data.images[e.id]), e.id); item.hasImage = true; } catch (_) { item.hasImage = false; } }
    else if (item.hasImage && !(cur && cur.hasImage)) item.hasImage = false;
    changed.push(item);
  }
  await idb.putMany('expenses', changed);
  changed.forEach(it => { const i = S.expenses.findIndex(x => x.id === it.id); if (i >= 0) S.expenses[i] = it; else S.expenses.push(it); });
  if (Array.isArray(data.categories)) data.categories.forEach(c => { if (c && c.name && !S.categories.some(x => x.name === c.name)) S.categories.push({ name: c.name, icon: c.icon || '🏷️' }); });
  S.expenses.forEach(e => { if (!S.categories.some(c => c.name === e.category)) S.categories.push({ name: e.category, icon: '🏷️' }); });
  if (data.shopMap && typeof data.shopMap === 'object') S.shopMap = { ...data.shopMap, ...S.shopMap };

  enqueue(changed.map(e => e.id), 'upsert');

}

  await saveMeta('categories', S.categories);
  if (oldName !== newName) await reassignCategory(oldName, newName);
  renderSettings(); refreshFormLists(); toast('บันทึกแล้ว');
}
async function reassignCategory(from, to) {
  const changed = S.expenses.filter(e => e.category === from);
  changed.forEach(e => { e.category = to; e.updatedAt = Date.now(); });
  if (changed.length) await idb.putMany('expenses', changed);
  Object.keys(S.shopMap).forEach(k => { if (S.shopMap[k] === from) S.shopMap[k] = to; });
  await saveMeta('shopMap', S.shopMap);
  enqueue(changed.map(e => e.id), 'upsert');
}
async function deleteCategory(i) {
  const c = S.categories[i]; if (!c) return;
  if (S.categories.length <= 1) { toast('ต้องมีอย่างน้อย 1 หมวด'); return; }
  const used = S.expenses.filter(e => e.category === c.name).length;
  let target = null;
  if (used) {
    const others = S.categories.filter(o => o.name !== c.name);
    const v = await ask({
      title: `ลบหมวด “${c.name}”`,
      html: `มี ${used} รายการในหมวดนี้ ย้ายไปหมวด:<label><select name="to">${others.map(o => `<option value="${esc(o.name)}" ${o.name === 'อื่นๆ' ? 'selected' : ''}>${o.icon} ${esc(o.name)}</option>`).join('')}</select></label>`,
      buttons: [{ label: 'ยกเลิก', value: null }, { label: 'ย้ายและลบ', value: 'form', cls: 'danger' }],
    });
    if (!v) return;
    target = v.to;
  } else if (!(await confirmBox(`ลบหมวด “${c.name}”?`, 'หมวดนี้ยังไม่มีรายการ', 'ลบ', true))) return;
  S.categories.splice(i, 1);
  await saveMeta('categories', S.categories);
  if (target) await reassignCategory(c.name, target);
  else { Object.keys(S.shopMap).forEach(k => { if (S.shopMap[k] === c.name) delete S.shopMap[k]; }); await saveMeta('shopMap', S.shopMap); }
  renderSettings(); refreshFormLists(); toast('ลบหมวดแล้ว');
}
async function renderSettings() {
  const st = S.settings;
  const counts = {}; S.expenses.forEach(e => { counts[e.category] = (counts[e.category] || 0) + 1; });
  const shops = Object.entries(S.shopMap).sort((a, b) => a[0].localeCompare(b[0], 'th'));
  $('#v-settings').innerHTML = `<h2>ตั้งค่า</h2>
  <div class="card"><h3>ซิงก์ไป Google Sheets</h3>
    <div class="muted small" style="margin-bottom:10px">ส่งเฉพาะข้อความ ไม่ส่งรูปบิล · รหัสลับเก็บในเครื่องนี้เท่านั้น ไม่อยู่ในไฟล์สำรอง</div>
    <label>Web app URL<input id="s-url" value="${esc(st.syncUrl)}" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    <label>รหัสลับ (ตรงกับ SECRET ใน Apps Script)<input id="s-secret" type="password" value="${esc(st.syncSecret)}" autocomplete="off"></label>
    <button type="button" class="primary" style="width:100%" data-act="set-connect">บันทึกและทดสอบ</button>
    <div id="sync-msg" class="small" style="margin-top:8px"></div>
    <div id="sync-status"></div>
    ${isConnected() ? `<div class="btns"><button type="button" data-act="sync-now">🔄 ซิงก์ตอนนี้</button><button type="button" data-act="resend-all">ส่งทั้งหมดอีกครั้ง</button><button type="button" class="danger" data-act="disconnect">ยกเลิกการเชื่อมต่อ</button></div>` : ''}
    <details class="howto"><summary>วิธีตั้งค่า Google Sheet (ครั้งเดียว)</summary>
      <ol>
        <li>สร้าง Google Sheet ใหม่ → เมนู <b>ส่วนขยาย › Apps Script</b></li>
        <li>ลบโค้ดเดิม แล้ววางโค้ดที่คัดลอกจากปุ่มด้านล่าง</li>
        <li>แก้บรรทัด <code>const SECRET = 'CHANGE-ME';</code> เป็นรหัสลับของคุณ แล้วกดบันทึก</li>
        <li><b>Deploy › New deployment</b> → ประเภท <b>Web app</b> · Execute as: <b>Me</b> · Who has access: <b>Anyone</b> → Deploy → อนุญาตสิทธิ์</li>
        <li>คัดลอก Web app URL (ลงท้าย /exec) มาวางด้านบน ใส่รหัสลับเดียวกัน แล้วกด “บันทึกและทดสอบ”</li>
      </ol>
      <button type="button" style="width:100%" data-act="copy-gs">📋 คัดลอกโค้ด Apps Script</button>
    </details>
  </div>

  <div class="card"><h3>การอ่านสลิปอัตโนมัติ</h3>
    <label>วิธีอ่าน<select id="s-ocr">
      ${opt('local', 'อ่านในเครื่อง (ฟรี · ใช้เน็ตครั้งแรกเพื่อโหลดภาษาไทย)', st.ocrMode)}
      ${opt('gemini', 'Gemini API (แม่นกว่า · ต้องมี API key · รูปถูกส่งไป Google)', st.ocrMode)}
      ${opt('off', 'ปิด (แนบรูปอย่างเดียว กรอกเอง)', st.ocrMode)}
    </select></label>
    <div id="gemini-box" ${st.ocrMode === 'gemini' ? '' : 'hidden'}>
      <label>Gemini API key<input id="s-gkey" type="password" value="${esc(st.geminiKey)}" autocomplete="off" placeholder="ขอฟรีที่ aistudio.google.com"></label>
      <label>ชื่อโมเดล<input id="s-gmodel" value="${esc(st.geminiModel)}" autocapitalize="off" spellcheck="false"></label>
      <div class="muted small">API key เก็บในเครื่องนี้เท่านั้น ไม่อยู่ในไฟล์สำรอง</div>
    </div>
  </div>

  <div class="card"><h3>หมวดหมู่</h3>
    ${S.categories.map((c, i) => `<div class="setrow"><span style="font-size:20px">${c.icon}</span><span class="grow">${esc(c.name)} <span class="muted small">${counts[c.name] || 0} รายการ</span></span><button type="button" data-act="cat-edit" data-i="${i}">แก้ไข</button><button type="button" class="danger" data-act="cat-del" data-i="${i}">ลบ</button></div>`).join('')}
    <button type="button" style="width:100%;margin-top:8px" data-act="cat-add">＋ เพิ่มหมวดหมู่</button>
  </div>

  <div class="card"><h3>ร้านที่จำหมวดไว้ (${shops.length})</h3>
    <div class="muted small" style="margin-bottom:6px">บันทึกร้านเดิมครั้งหน้า แอปจะเลือกหมวดให้เอง · เปลี่ยนหมวดตอนบันทึกเพื่อสอนใหม่</div>
    ${shops.length ? shops.map(([k, v]) => `<div class="setrow"><span class="grow">${esc(k)} → ${catOf(v).icon} ${esc(v)}</span><button type="button" data-act="shop-del" data-k="${esc(k)}">ลืม</button></div>`).join('') : '<div class="muted small">ยังไม่มี</div>'}
  </div>

  <div class="card"><h3>สำรอง / ส่งออก</h3>
    <div class="btns">
      <button type="button" data-act="exp-json">💾 สำรอง JSON</button>
      <button type="button" data-act="imp-json">📂 กู้คืน JSON</button>
      <button type="button" data-act="exp-csv">📄 ส่งออก CSV</button>
    </div>
    <div class="muted small" id="storage-info" style="margin-top:10px"></div>
  </div>

  <div class="card"><h3>โซนอันตราย</h3>
    <button type="button" class="danger" style="width:100%" data-act="clear-all">ลบข้อมูลทั้งหมดในเครื่อง</button>
    <div class="muted small" style="margin-top:6px">ไม่ลบข้อมูลใน Google Sheet</div>
  </div>
  <div class="muted small" style="text-align:center">บันทึกบิล v${APP_VERSION}</div>`;
  renderSyncStatus();
  try {
    const parts = [`${S.expenses.length} รายการ · ${S.expenses.filter(e => e.hasImage).length} รูปบิล`];
    if (navigator.storage && navigator.storage.estimate) { const e = await navigator.storage.estimate(); parts.push(`ใช้พื้นที่ประมาณ ${(e.usage / 1048576).toFixed(1)} MB`); }
    if (navigator.storage && navigator.storage.persisted) parts.push((await navigator.storage.persisted()) ? 'พื้นที่ถาวร ✓' : 'แนะนำ: เพิ่มแอปลงหน้าจอโฮมเพื่อกันข้อมูลถูกล้าง');
    const el = $('#storage-info'); if (el) el.textContent = parts.join(' · ');
  } catch (_) {}
}

/* ================= เหตุการณ์ ================= */
const ACTIONS = {
  tab: el => { if (el.dataset.v !== 'add' && S.editingId) resetForm(); go(el.dataset.v); },
  save: () => saveForm(),
  'cancel-edit': () => { resetForm(); go('list'); },
  delete: () => S.editingId && deleteExpense(S.editingId),
  pay: el => { S.form.pay = el.dataset.p; S.form.payTouched = true; renderPay(); },
  'rm-tag': el => { S.form.tags = S.form.tags.filter(t => t !== el.dataset.tag); renderTags(); },
  'add-tag': el => { if (!S.form.tags.includes(el.dataset.tag)) S.form.tags.push(el.dataset.tag); renderTags(); },
  'add-cat': async () => { const c = await addCategoryDialog(); if (c) { renderCatSelect(c.name); S.form.catTouched = true; $('#cat-hint').textContent = ''; } },
  'view-photo': () => { if (S.form.image) showImage(S.form.image); else $('#in-camera').click(); },
  reread: () => { if (S.form.image) runOcr(); },
  'rm-photo': () => { S.form.image = null; S.form.ocrCanvas = null; S.form.imageChanged = true; ocrToken++; showPreview(null); setOcr(null); },
  'close-viewer': () => { $('#viewer').hidden = true; },
  edit: el => editExpense(el.dataset.id),
  ftag: (el, ev) => { ev.stopPropagation(); S.listFilter.tag = el.dataset.tag; renderList(); },
  bar: el => { document.querySelectorAll(`.bar-col[data-chart="${el.dataset.chart}"]`).forEach(b => b.classList.toggle('sel', b === el)); const ci = $('#ci-' + el.dataset.chart); if (ci) ci.textContent = el.dataset.tip; },
  'sum-mode': el => { S.sum.mode = el.dataset.mode; renderSummary(); },
  'sum-step': el => { const d = +el.dataset.d; if (S.sum.mode === 'year') S.sum.y += d; else { S.sum.m += d; if (S.sum.m < 1) { S.sum.m = 12; S.sum.y--; } if (S.sum.m > 12) { S.sum.m = 1; S.sum.y++; } } renderSummary(); },
  gomonth: el => { S.sum.mode = 'month'; S.sum.m = +el.dataset.m; renderSummary(); window.scrollTo(0, 0); },
  'sync-badge': async () => {
    if (S.sync.error && S.sync.pending) {
      const r = await ask({ title: 'ซิงก์ไม่สำเร็จ', html: `${esc(S.sync.error)}<br><br>รอส่ง ${S.sync.pending} รายการ · แอปจะลองใหม่อัตโนมัติ`, buttons: [{ label: 'ไปตั้งค่า', value: 'set' }, { label: 'ลองอีกครั้ง', value: 'retry', cls: 'primary' }] });
      if (r === 'retry') flushSync(); else go('settings');
    } else { flushSync(); toast(S.sync.pending ? 'กำลังซิงก์…' : 'ข้อมูลตรงกับชีตแล้ว'); }
  },
  'set-connect': () => connectSheet(),
  'sync-now': () => { flushSync(); toast('กำลังซิงก์…'); },
  'resend-all': async () => { await enqueue(S.expenses.map(e => e.id), 'upsert'); toast(`กำลังส่ง ${S.expenses.length} รายการ`); },
  disconnect: () => disconnectSheet(),
  'copy-gs': async () => {
    const code = $('#gs-code').textContent.trim();
    try { await navigator.clipboard.writeText(code); toast('คัดลอกโค้ดแล้ว ✓'); }
    catch (_) {
      ask({ title: 'คัดลอกโค้ด', html: '<textarea style="width:100%;height:220px;font-size:12px" readonly>' + esc(code) + '</textarea><div class="muted small">แตะค้างที่ข้อความ › เลือกทั้งหมด › คัดลอก</div>', buttons: [{ label: 'ปิด', value: null }] });
    }
  },
  'cat-add': async () => { if (await addCategoryDialog()) { renderSettings(); refreshFormLists(); } },
  'cat-edit': el => editCategory(+el.dataset.i),
  'cat-del': el => deleteCategory(+el.dataset.i),
  'shop-del': async el => { delete S.shopMap[el.dataset.k]; await saveMeta('shopMap', S.shopMap); renderSettings(); },
  'exp-json': () => exportJSON(),
  'exp-csv': () => exportCSV(),
  'imp-json': () => $('#imp-file').click(),
  'clear-all': () => clearAll(),
};

function bindEvents() {
  document.addEventListener('click', ev => {
    const el = ev.target.closest('[data-act]');
    if (!el) return;
    if (el.id === 'viewer' && ev.target !== el) return;
    const fn = ACTIONS[el.dataset.act];
    if (fn) fn(el, ev);
  });
  $('#in-camera').addEventListener('change', e => { onPhoto(e.target.files[0]); e.target.value = ''; });
  $('#in-gallery').addEventListener('change', e => { onPhoto(e.target.files[0]); e.target.value = ''; });
  $('#imp-file').addEventListener('change', e => { if (e.target.files[0]) importJSON(e.target.files[0]); e.target.value = ''; });
  F.shop.addEventListener('input', applyShopMemory);
  F.shop.addEventListener('change', applyShopMemory);
  F.cat.addEventListener('change', () => { S.form.catTouched = true; S.form.catAuto = false; $('#cat-hint').textContent = ''; });
  F.date.addEventListener('input', () => { S.form.dateTouched = true; });
  F.time.addEventListener('input', () => { S.form.timeTouched = true; });
  F.tag.addEventListener('keydown', e => {
    if (e.key === ' ' || e.key === 'Enter' || e.key === ',') { e.preventDefault(); commitTagInput(); }
    else if (e.key === 'Backspace' && !F.tag.value && S.form.tags.length) { S.form.tags.pop(); renderTags(); }
  });
  F.tag.addEventListener('input', () => { if (/[\s,]/.test(F.tag.value)) commitTagInput(); });
  F.tag.addEventListener('blur', commitTagInput);
  $('#tagbox').addEventListener('click', e => { if (e.target.id === 'tagbox') F.tag.focus(); });
  $('#v-list').addEventListener('change', e => {
    const k = e.target.dataset.f; if (!k) return;
    S.listFilter[k] = e.target.value;
    e.target.classList.toggle('on', k === 'month' ? e.target.value !== 'all' : !!e.target.value);
    renderListBody();
  });
  $('#v-list').addEventListener('input', e => { if (e.target.id === 'list-q') { S.listFilter.q = e.target.value; renderListBody(); } });
  $('#v-settings').addEventListener('change', async e => {
    const id = e.target.id;
    if (id === 's-ocr') { S.settings.ocrMode = e.target.value; $('#gemini-box').hidden = e.target.value !== 'gemini'; }
    else if (id === 's-gkey') S.settings.geminiKey = e.target.value.trim();
    else if (id === 's-gmodel') S.settings.geminiModel = e.target.value.trim() || 'gemini-2.5-flash';
    else return;
    await saveSettings(); toast('บันทึกการตั้งค่าแล้ว');
  });
  window.addEventListener('online', () => { flushSync(); });
  window.addEventListener('offline', updateBadge);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) flushSync(); });
}

async function init() {
  ['amount', 'shop', 'date', 'time', 'cat', 'pay', 'tag', 'note'].forEach(k => { F[k] = $('#f-' + k); });
  try { db = await openDB(); }
  catch (e) {
    $('#fatal').innerHTML = `<div class="fatal">เปิดพื้นที่เก็บข้อมูลไม่ได้: ${esc(e.message)}<br>ถ้าเปิดในโหมดส่วนตัว (Private) ให้เปิดแบบปกติ</div>`;
    return;
  }
  try {
    const [ex, cats, shopMap, settings] = await Promise.all([idb.getAll('expenses'), idb.get('meta', 'categories'), idb.get('meta', 'shopMap'), idb.get('meta', 'settings')]);
    S.expenses = ex || [];
    S.categories = Array.isArray(cats) && cats.length ? cats : DEFAULT_CATS.map(c => ({ ...c }));
    if (!cats) await saveMeta('categories', S.categories);
    S.shopMap = shopMap || {};
    Object.assign(S.settings, settings || {});
  } catch (e) { toast('โหลดข้อมูลผิดพลาด: ' + e.message, 4000); }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  bindEvents();
  resetForm();
  refreshFormLists();
  S.sync.pending = await idb.count('outbox').catch(() => 0);
  updateBadge();
  flushSync();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
}
init();
</script>
